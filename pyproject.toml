[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stateset-icommerce-agents"
version = "0.11.0"
description = "The commerce-agents architecture on the StateSet iCommerce engine."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "anyio>=4,<5",
  "stateset-embedded==1.28.5",
  "fastapi>=0.141",
  "uvicorn>=0.52",
  "pydantic>=2.7",
  "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.27,<1",
  # The vendored commerce-agents packages. No index carries them; requirements.txt
  # installs them editable from vendor/ first, and naming them here keeps a built
  # wheel honest about what it imports.
  "commerce-common",
  "shopping-agent-core",
  "shopping-agent-runtime",
  "merchant-agent-core",
  "merchant-agent-runtime",
  "mcp<3",
]

[tool.mypy]
python_version = "3.12"
files = ["engine_backend", "host", "mcp_servers", "scripts", "evals"]
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.hatch.build.targets.wheel]
packages = ["engine_backend", "host", "mcp_servers"]
