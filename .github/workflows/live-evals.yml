name: Live Claude evals

on:
  workflow_dispatch:
  schedule:
    # Weekly rather than per-push: these calls are billable and test model behavior,
    # not deterministic repository code.
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: live-claude-evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: live-evals
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Require the protected live-eval credential
        run: test -n "$ANTHROPIC_API_KEY"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run each behavioral evaluation three times
        shell: bash
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/live-evals"
          mkdir -p "$report_dir"
          python -m evals.run --require-key --repetitions 3 \
            --report "$report_dir/live-evals.json" | tee "$report_dir/live-evals.log"
          python scripts/live_eval_check.py --report "$report_dir/live-evals.json" \
            --commit "$(git rev-parse HEAD)"

      - name: Hash available evidence, including failed runs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/live-evals"
          if [ -d "$report_dir" ]; then
            cd "$report_dir"
            for artifact in live-evals.json live-evals.log; do
              if [ -f "$artifact" ]; then
                sha256sum "$artifact"
              fi
            done > live-evals.sha256
          fi

      - name: Retain release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-evals-${{ github.sha }}
          path: |
            ${{ runner.temp }}/live-evals/live-evals.log
            ${{ runner.temp }}/live-evals/live-evals.json
            ${{ runner.temp }}/live-evals/live-evals.sha256
          if-no-files-found: error
          retention-days: 30
