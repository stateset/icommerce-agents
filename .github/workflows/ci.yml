name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single top-level knob: the web workspace builds Next 16, which requires Node >= 20.9.
  NODE_VERSION: "22"

jobs:
  python:
    # requires-python caps at "<3.13" (pyproject.toml), so a 3.13 job cannot install
    # the package. Run 3.12 only until that cap is deliberately widened.
    strategy:
      matrix:
        python-version: ["3.12"]
    runs-on: ubuntu-latest
    # stateset-embedded==1.28.5 publishes manylinux_2_34 wheels and ubuntu-latest's glibc
    # satisfies that, so this job normally installs from a prebuilt wheel in well under
    # a minute. On a runner with an older glibc, pip falls back to building the engine
    # from its cargo/maturin sdist, which compiles Rust and can take 15+ minutes — hence
    # the generous timeout below.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify dependency compatibility
        run: python -m pip check

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: pytest
        run: pytest

      - name: drift check
        run: python scripts/check.py

      - name: denial walkthrough
        run: python scripts/denials.py

      # Keyless tour, run twice against the same db: places an order through the
      # governed checkout.commit, shows an unapproved apply refused, and records both
      # evidence kinds (activity_log, kernel_receipt) -- no API key, no model. Run
      # twice because re-runnability against existing state was itself a bug once
      # (see scripts/tour.py's docstring); this is where a regression in that would
      # show up first, on a machine that is not the developer's.
      - name: keyless tour proves checkout, refusal, and both evidence kinds against the real engine (twice, same db)
        run: |
          python scripts/tour.py --db /tmp/ci-tour.db
          python scripts/tour.py --db /tmp/ci-tour.db

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This job never blocks the python job: it runs independently, in parallel, and
    # nothing in `python` depends on it (no `needs:`).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: npm ci
        run: npm ci

      # Task 7 cleared the workspace's high-severity advisories by moving to Next 16 /
      # React 19. Without this step they could come back on a transitive bump with
      # nothing failing, which is the whole reason that upgrade was done.
      - name: npm audit
        run: npm audit --audit-level=high

      - name: build storefront
        run: npm run build --workspace web/storefront

      - name: build portal
        run: npm run build --workspace web/portal

      # From here down: an actual browser, painting an actual page, against a host that
      # actually ran the tour -- docs/testing.md used to say no automated check in this
      # repo had done that. No API key is set, so /capabilities reports "unconfigured";
      # that is the state the check asserts against.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: install python dependencies (for the host under test)
        run: pip install -r requirements-dev.txt

      - name: verify python dependency compatibility
        run: python -m pip check

      - name: install headless chromium
        run: npx playwright install --with-deps chromium

      - name: start the host (no ANTHROPIC_API_KEY -- capabilities reports unconfigured)
        run: |
          DEMO_DB_PATH=/tmp/ci-web-tour.db nohup python -m uvicorn scripts.run_demo:build_app \
            --factory --host 0.0.0.0 --port 8000 > /tmp/host.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/readyz && exit 0
            sleep 1
          done
          echo "host never came up on :8000"; cat /tmp/host.log; exit 1

      - name: run the keyless tour against the live host, so there is state to render
        run: python scripts/tour.py --db /tmp/ci-web-tour.db --base-url http://127.0.0.1:8000

      - name: start the storefront and portal against the live host
        run: |
          nohup npm run start --workspace web/storefront > /tmp/storefront.log 2>&1 &
          nohup npm run start --workspace web/portal > /tmp/portal.log 2>&1 &
          for url in http://127.0.0.1:3000 http://127.0.0.1:3100; do
            for i in $(seq 1 30); do
              curl -sf "$url" > /dev/null && break
              sleep 1
            done
          done

      - name: headless check -- portal renders a sealed kernel receipt and an activity-log id, visibly distinct; storefront renders live order state
        run: |
          STOREFRONT_URL=http://localhost:3000 PORTAL_URL=http://localhost:3100 \
            node scripts/pw_check.mjs
